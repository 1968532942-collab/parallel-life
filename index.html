function intro(){let lights='<div class="layer back">';for(let i=0;i<14;i++)lights+=`<span class="citylight ${'abcde'[i%5]}" style="animation-delay:-${i*.59}s;--y:${20+i*4}%"></span>`;lights+='</div>';return `<div class="page" data-page="intro">${world(`<div class="train layer back"></div>${lights}<div class="train-rail"></div><div class="window-frame"></div><div class="window-sill"></div><div class="introletter" id="envelope"><div class="envelope-body"></div></div>${hands()}<canvas id="fog" class="glass-fog" aria-label="擦去玻璃上的雾气"></canvas><div class="glass-hint" id="fogHint">↔ 用手指擦去玻璃上的雾气</div>`, 'push')}${sparks(9)}<div class="ui top"><div class="eyebrow">A STORY THROUGH MY EYES · 01</div><h1 class="title">如果那天，<br><em>我选择了另一条路</em></h1><p class="bodytext">我在末班车上，<br>看见了一封不属于这个世界的信。</p></div><div class="reveal-note" id="revealNote"><p class="bodytext">玻璃后面，浮现出一行字：<br>「另一个我，在等我。」</p></div><div class="ui low" id="introBottom"><button class="secondary" data-next="letter">我想拆开那封信　↗</button><p class="subtle">擦拭玻璃可触发隐藏画面 · 也可以直接继续</p></div></div>`}
function letter(){return `<div class="page" data-page="letter"><div class="letterbg"></div><div class="letterspot"></div>${sparks(24)}<div class="ui top"><div class="eyebrow">THE LETTER · 02</div><h2 class="title" style="font-size:32px">我收到了另一个我的来信</h2></div><article class="letterpaper"><span class="to">TO · MY OTHER SELF</span><span class="seal">✦</span><div class="lettercopy">“我”：<br><br>如果某一天，<br>我走上了另一条路，<br>是不是也会遇见<br>另一种风景？<br><br>现在，我可以去看看了。</div><div class="signed">—— 来自平行时空的我</div></article><div class="ui low"><div class="hold-wrap"><button class="hold" id="holdLetter"><span class="fill"></span><span>长按 1 秒 · 走进信中的世界</span></button><button class="fallback" data-next="crossroads">点击直接继续 →</button></div></div></div>`}
function crossroads(){return `<div class="page" data-page="crossroads">${world(`<div class="corridor layer back"></div><div class="moonbeam"></div><div class="corridor-arch"></div><div class="door city">${panorama('city','c1')}<div class="door-halo"></div></div><div class="door home">${panorama('home','h1')}<div class="door-halo"></div></div><div class="floor"></div>${figure('tiny')}<div class="pov-finger">${handSvg()}</div>`, 'push')}${sparks(16)}<div class="ui top"><div class="eyebrow">CHAPTER 01 · THE CROSSROADS</div><h2 class="title">18岁那年，<br>我站在岔路口</h2><p class="bodytext">两扇门，都通向未知。<br>这一次，我决定——</p></div><button class="door-btn city" data-route="far" aria-label="选择奔赴远方"></button><button class="door-btn home" data-route="near" aria-label="选择留在家乡"></button><div class="door-choice city"><button class="tiny-btn" data-route="far">奔赴远方　↗</button><span>去陌生城市寻找光</span></div><div class="door-choice home"><button class="tiny-btn" data-route="near">留在家乡　↗</button><span>从熟悉的地方出发</span></div><div class="ui low" style="bottom:calc(env(safe-area-inset-bottom) + 7px)"><p class="subtle">点击一扇门 · 移动手机或鼠标观察空间层次</p></div></div>`}
function memory(){let far=state.route==='far';return `<div class="page" data-page="memory">${world(`<div class="memory-world ${far?'city':'home'} layer back"></div><div class="memory-sun layer mid"></div>${far?'<div class="memory-cityscape layer mid"></div><div class="memory-windows layer mid"></div>':'<div class="memory-house layer mid"></div><div class="memory-trees layer mid"></div>'}<div class="memory-ground layer front"></div>${figure()}${sparks(20)}`,'push')}<div class="ui top"><div class="eyebrow">CHAPTER 03 · COLLECTED MOMENTS</div><h2 class="title" style="font-size:31px">三年后，我回头望去</h2><p class="bodytext">${far?'我来到陌生的城市。人群从身旁经过。':'我留在熟悉的小城。时光藏在每条街巷里。'}<br>有些瞬间，我想再看一眼。</p></div><div class="hotspots"><button class="hotspot" style="--x:14%;--y:46%" data-memory="0" aria-label="触摸第一段记忆">${far?'▤':'⌂'}</button><button class="hotspot" style="--x:71%;--y:54%" data-memory="1" aria-label="触摸第二段记忆">✦</button><button class="hotspot" style="--x:32%;--y:66%" data-memory="2" aria-label="触摸第三段记忆">${far?'♬':'❀'}</button></div><div id="memoryPop"></div><div class="memory-counter"><span class="dots" id="memoryDots">○ ○ ○</span><button id="memoryNext" disabled>触摸至少两处回忆　→</button></div></div>`}
function decision(){return `<div class="page" data-page="decision">${world(`<div class="decision-back"></div><div class="decision-window"></div>${figure('decision-person')}<div class="floor"></div>${sparks(24)}`,'pull')}<div class="ui top"><div class="eyebrow">CHAPTER 04 · A NEW DECISION</div><h2 class="title" style="font-size:32px">又一次机会，<br>在我面前出现</h2><p class="bodytext">${state.route==='far'?'有人向我伸出手，邀请我负责一项未知的计划。':'我终于有机会，把藏了很久的心愿变成现实。'}<br>我想如何回答？</p></div><div class="decision-choices"><button data-decision="leap"><span class="sweep"></span><span class="symbol">✦</span><span>我想勇敢试一次</span><small>朝未知迈出一步</small></button><button data-decision="pause"><span class="sweep"></span><span class="symbol">☾</span><span>我想给自己时间</span><small>按自己的节奏前行</small></button></div><div class="ui low" style="bottom:calc(env(safe-area-inset-bottom) + 8px)"><p class="subtle">选择我的答案 · 每一种决定都值得被尊重</p></div></div>`}
function warp(){let rings='';for(let i=0;i<7;i++)rings+=`<div class="ring" style="--sz:${130+i*70}px;--dur:${4+i*.6}s;--delay:-${i*.65}s;--r:${i*17}deg"></div>`;for(let i=0;i<27;i++)rings+=`<div class="tunnel-stars" style="--a:${i*13.33}deg;--w:${45+i*3}px;--d:-${i*.13}s"></div>`;return `<div class="page" data-page="warp"><div class="tunnel">${rings}</div>${sparks(24)}<div class="ui top"><div class="eyebrow">TIME IS REWRITING</div><h2 class="title">时间开始倒流，<br>我向另一个自己靠近</h2><p class="bodytext">我听见许多个可能的我，<br>在时间深处轻声呼唤。</p></div><div class="time-disc">Ⅻ</div><div class="swipezone" id="swipeZone" aria-label="向上滑动穿过时间隧道"><div style="text-align:center"><div class="swipe-arrow">↑</div><span>向上滑动，穿越时间</span></div></div><button class="fallback warpskip" id="warpSkip">点击穿越时空 →</button></div>`}
function result(){let e=endingData[state.ending];let type=state.ending==='maker'?'home':'city';return `<div class="page" data-page="result">${world(`<div class="result-sky ${state.ending}"></div><div class="memory-sun layer mid"></div><div class="result-land layer front"></div>${figure('result-person')}${sparks(36)}`,'pull')}<div class="ui top"><div class="eyebrow">ANOTHER LIFE · MY ENDING</div><h2 class="title" style="font-size:clamp(22px,6.6vw,29px);white-space:nowrap">我终于见到了另一个自己</h2><div class="result-quote">${e.quote.replace('\n','<br>')}</div></div><div class="result-panel"><div class="tag">MY PARALLEL LIFE / 0${state.ending==='light'?1:state.ending==='maker'?2:3}</div><h2>${e.name}</h2><div class="eyebrow" style="margin:0;font-size:9px">${e.en}</div><p>${e.story}</p><div class="result-controls"><button class="primary" id="openPoster">生成我的结局海报 ↓</button><button class="secondary" id="again">再走一次 ↻</button></div></div></div>`}

 {when:'第一年 · 周五的夜晚',title:'我和家人走在晚风里',lead:'下班后的江边步道，路灯一盏盏亮起来。',cue:'触碰路灯，点亮归途',glyph:'✧',accent:'#ffd8a4',kind:'walk',y:'50%',
  story:['我和家人慢慢沿着河走。有人问起今天的工作，有人指着水面说，今晚的月亮真亮。','我们并没有聊什么了不起的大事。可走到桥头时，我忽然想：这样的晚上，我想再多拥有一些。']},
 {when:'第二年 · 冬日的傍晚',title:'我还是爱这家小店',lead:'天冷了，街角面馆又腾起熟悉的白雾。',cue:'点击热气，走进小店',glyph:'♨',accent:'#edc18e',kind:'noodles',y:'54%',
  story:['我推开门，老板不用问就知道我想吃什么。汤滚着热气，窗外的人匆匆走过。','我一个人坐在靠窗的位置，听着熟悉的方言和碗筷声，觉得平凡的日子也有自己的重量。']},
 {when:'第二年 · 雨后的星期六',title:'我发现小城也有新故事',lead:'雨停了，我拐进从前没留意过的旧书店。',cue:'点亮书店窗里的灯',glyph:'▤',accent:'#f4c790',kind:'bookshop',y:'52%',
  story:['推门时风铃轻响。我从书架上抽出一本旧画册，里面夹着一张早已泛黄的车票。','我一直以为熟悉意味着一成不变。可这座小城，总有还没来得及认识的角落。']},

  story:['晨光落在刚抽芽的树枝上。我在长椅坐下，翻开记了很多想法的笔记本。','我没有离开这座城，却开始尝试以前不敢做的事。新的生活，不一定要从远行开始。']}
 ],
 far:[
 {when:'第一年 · 初到城市',title:'我第一次坐上末班地铁',lead:'下班已经很晚，站台上仍然挤满了人。',cue:'触碰车窗，看向城市',glyph:'▥',accent:'#a9d6fb',kind:'metro',y:'55%',
  story:['车窗里映出我的脸，外面是闪过的一栋栋高楼。我不认识身边任何一个人，却知道每个人都在赶往自己的生活。','那一晚我有点孤单，也有点激动：原来世界真的这么大。']},
 {when:'第一年 · 周六夜晚',title:'我终于去看了一场音乐会',lead:'灯光暗下去，整个音乐厅突然安静了。',cue:'触碰舞台，让音乐响起',glyph:'♫',accent:'#fbd9ad',kind:'concert',y:'55%',

 {when:'第二年 · 夏日深夜',title:'我认识了新的朋友',lead:'演出结束后，我们临时决定去吃夜宵。',cue:'点亮街角的霓虹',glyph:'✦',accent:'#f7b9bb',kind:'friends',y:'53%',

function ambient(kind){let cfg={osmanthus:{n:26,cls:'gui',ch:'✿',t:[11,17],s:[8,14]},walk:{n:12,cls:'leaf',ch:'',t:[10,15],s:[9,15],c:['#8ca46a','#b39a5a','#6f8c5e']},spring:{n:10,cls:'bloom',ch:'',t:[12,18],s:[6,9],c:['#f6e6c8','#e9f0c0','#f4d9d4']}}[kind];if(!cfg)return '';let h='';for(let i=0;i<cfg.n;i++){let t=cfg.t[0]+(i*37%10)/10*(cfg.t[1]-cfg.t[0]),sz=cfg.s[0]+(i*53%10)/10*(cfg.s[1]-cfg.s[0]),c=cfg.c?cfg.c[i%cfg.c.length]:'';h+=`<i class="${cfg.cls}" style="--x:${(i*61+7)%96}%;--t:${t.toFixed(1)}s;--d:-${(i*t/cfg.n*1.7%t).toFixed(1)}s;--s:${sz.toFixed(0)}px;--sw:${(i%2?1:-1)*(14+i*7%26)}px;${c?'--c:'+c:''}">${cfg.ch}</i>`}return `<div class="day-ambient" aria-hidden="true">${h}</div>`}
function day(){const items=lifeDays[state.route],d=items[state.dayIndex],done=state.dayRevealed;
 const dots=items.map((_,i)=>`<i class="${i<=state.dayIndex?'on':''}"></i>`).join('');
 return `<div class="page day-page" data-page="day"><div class="scene-day ${done?'activated':''}" id="dayScene">${scenery(d.kind)}</div>${ambient(d.kind)}<div class="vignette"></div><div class="day-pov" id="dayPov">${handSvg()}</div><div id="dayFlurry" class="day-flurry"></div><div class="day-top"><div class="day-progress">${dots}</div><div class="eyebrow">${state.route==='near'?'THE LIFE I STAYED':'THE LIFE I CHASED'} · 0${state.dayIndex+1}</div><h2>${d.title}</h2><p>${d.lead}</p></div><div class="day-count">${state.dayIndex+1} / ${items.length}</div><button class="day-activity" style="--touch-y:${d.y}" id="dayTouch" aria-label="${d.cue}" ${done?'disabled':''}><span class="glyph">${d.glyph}</span><small>${d.cue}</small></button><div class="day-bottom">${done?`<div class="day-story"><div class="little">${d.when}</div>${d.story.map(t=>`<p>${t}</p>`).join('')}</div><button class="primary" id="dayContinue">${state.dayIndex===items.length-1?'我想收藏这些瞬间　→':'走进下一个日常　→'}</button>`:`<div class="day-action-hint">我想亲手触碰这一刻，留下它的温度</div><button class="day-skip" id="dayRevealAlternate">直接读这段记忆</button>`}</div></div>`;
}
function setupDay(){const d=lifeDays[state.route][state.dayIndex];
 function reveal(){if(state.dayRevealed)return;state.dayRevealed=true;state.experiences.push(d.title);sound(d.kind==='concert'?740:d.kind==='osmanthus'?580:520);let btn=$('#dayTouch'),sc=$('#dayScene');btn?.classList.add('collecting');sc?.classList.add('activated');
 // sensory particles are inexpensive and work offline
 if(d.kind==='osmanthus'){catchFlower();return}
 let overlay=$('#dayFlurry');for(let i=0;i<14;i++){let sp=document.createElement('span');sp.textContent=d.kind==='concert'?'♪':d.kind==='walk'?'✧':d.kind==='metro'?'✦':d.kind==='gallery'?'◈':d.kind==='spring'?'❀':d.kind==='sunrise'?'☼':d.kind==='friends'?'✧':d.kind==='osmanthus'?'✿':'✦';sp.style.cssText=`--xx:${4+(i*53)%93}%;--dd:${i*.07}s;--spd:${3+i%4}s;--fs:${11+i%3*7}px;--fc:${d.accent}`;overlay.appendChild(sp)}
 setTimeout(()=>{if(state.page==='day')render('day',true)},650)}
 function catchFlower(){let page=$('.day-page',stage),pov=$('#dayPov');page?.classList.add('catching');if(pov){pov.innerHTML=palmSvg();pov.classList.add('catching');let f=document.createElement('span');f.className='caught-flower';f.textContent='✿';pov.appendChild(f)}let line=document.createElement('div');line.className='catch-line';line.textContent='我伸出手，接住了一朵桂花';page?.appendChild(line);setTimeout(()=>sound(660),2900);setTimeout(()=>{if(state.page==='day')render('day',true)},4600)}
 $('#dayTouch')?.addEventListener('click',reveal);$('#dayRevealAlternate')?.addEventListener('click',reveal);
 $('#dayContinue')?.addEventListener('click',()=>{if(!state.dayRevealed)return;if(state.dayIndex<lifeDays[state.route].length-1){state.dayIndex++;state.dayRevealed=false;render('day')}else{state.memory=new Set();render('memory')}})
}

const views={intro,letter,crossroads,day,memory,decision,warp,result};
function render(page,instant=false){sceneToken++;const token=sceneToken;state.page=page;let p=$('.page',stage);const place=()=>{if(token!==sceneToken)return;stage.innerHTML=views[page]();bind(page);updateProgress(page);let w=$('#world');if(w){requestAnimationFrame(()=>{if(token===sceneToken)w.classList.remove('push','pull')})}};if(!instant&&p){p.classList.add('exit');setTimeout(place,350)}else place()}
function updateProgress(page){let idx={intro:0,letter:1,crossroads:2,day:3,memory:4,decision:5,warp:6,result:6}[page];progress.classList.toggle('on',page!=='intro');[...progress.children].forEach((el,i)=>el.classList.toggle('done',i<idx))}
function next(page){sound(520);render(page)}
function bind(page){stage.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>next(b.dataset.next)));if(page==='intro')setupFog();if(page==='letter')setupHold();if(page==='crossroads'){stage.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>{state.route=b.dataset.route;state.dayIndex=0;state.dayRevealed=false;state.experiences=[];sound(575);render('day')}))}if(page==='day')setupDay();if(page==='memory')setupMemory();if(page==='decision'){stage.querySelectorAll('[data-decision]').forEach(b=>b.addEventListener('click',()=>{state.action=b.dataset.decision;state.ending=state.action==='pause'?'gentle':state.route==='far'?'light':'maker';sound(650);render('warp')}))}if(page==='warp')setupSwipe();if(page==='result'){ $('#openPoster').addEventListener('click',openPoster);$('#again').addEventListener('click',restart)};setupParallax()}
function setupParallax(){let page=$('.page',stage);if(!page||!$('#world'))return;let handle=e=>{let b=page.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;const w=$('#world');if(!w)return;w.style.setProperty('--mx',(x*17).toFixed(1)+'px');w.style.setProperty('--my',(y*14).toFixed(1)+'px')};page.addEventListener('pointermove',handle,{passive:true});if(window.DeviceOrientationEvent){let last=0;const motion=e=>{if(!$('#world')||Date.now()-last<55)return;last=Date.now();let w=$('#world');w.style.setProperty('--mx',((e.gamma||0)*.5)+'px');w.style.setProperty('--my',((e.beta||0)*.13)+'px')};window.addEventListener('deviceorientation',motion,{passive:true,once:false});setTimeout(()=>window.removeEventListener('deviceorientation',motion),25000)}}
function setupFog(){const canvas=$('#fog');if(!canvas)return;let rect=canvas.getBoundingClientRect();let dpr=Math.min(2,window.devicePixelRatio||1);canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));let c=canvas.getContext('2d');c.scale(dpr,dpr);let w=rect.width,h=rect.height;c.fillStyle='#d1dbe02b';c.fillRect(0,0,w,h);c.fillStyle='#c3d3da42';c.fillRect(18,h*.32,w-36,h*.39);for(let i=0;i<85;i++){let x=(i*177)%w,y=(i*89)%h;c.beginPath();c.ellipse(x,y,1+(i%3),8+(i%9)*2,.1,0,Math.PI*2);c.fillStyle='#cedce33a';c.fill()}let drawing=false,last=null,dist=0,unlocked=false;function swipe(x,y){c.save();c.globalCompositeOperation='destination-out';c.lineWidth=75;c.lineCap='round';c.lineJoin='round';if(last){c.beginPath();c.moveTo(last.x,last.y);c.lineTo(x,y);c.stroke();dist+=Math.hypot(x-last.x,y-last.y)}else{c.beginPath();c.arc(x,y,36,0,Math.PI*2);c.fill()}c.restore();last={x,y};if(dist>Math.max(170,w*.55)&&!unlocked){unlocked=true;$('#fogHint')?.classList.add('hide');$('#revealNote')?.classList.add('show');canvas.style.pointerEvents='none';canvas.style.transition='opacity 1.2s';canvas.style.opacity='0';sound(620);toast('我擦去了雾气，发现那封信正等着我')}}canvas.addEventListener('pointerdown',e=>{drawing=true;last=null;canvas.setPointerCapture(e.pointerId);swipe(e.offsetX,e.offsetY)});canvas.addEventListener('pointermove',e=>{if(drawing)swipe(e.offsetX,e.offsetY)});canvas.addEventListener('pointerup',()=>{drawing=false;last=null});canvas.addEventListener('pointercancel',()=>{drawing=false;last=null})}
function setupHold(){const btn=$('#holdLetter');if(!btn)return;let timer=null,start=0,frame=null,done=false;const fill=$('.fill',btn);function reset(){if(done)return;clearTimeout(timer);cancelAnimationFrame(frame);fill.style.width='0%'}function advance(){if(done)return;let amount=Math.min(100,(performance.now()-start)/10);fill.style.width=amount+'%';if(amount>=100){done=true;sound(690);render('crossroads')}else frame=requestAnimationFrame(advance)}btn.addEventListener('pointerdown',e=>{if(done)return;start=performance.now();btn.setPointerCapture(e.pointerId);advance()});['pointerup','pointercancel','lostpointercapture'].forEach(type=>btn.addEventListener(type,reset));btn.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();start=performance.now();advance()}});btn.addEventListener('keyup',reset)}
const memories={far:[['车票','我攥着一张单程车票。那时我不知道前路多远，只知道我真的出发了。'],['窗灯','有一盏灯在深夜为我亮起。我突然发现，陌生的城市也能有温度。'],['街角的歌','人潮里传来熟悉的旋律。我停住脚步，第一次认真想念故乡。']],near:[['旧门牌','熟悉的门牌还在。我却发现，走过这么多次的路也有新的风景。'],['一盏灯','我把自己的心愿写下来，放在桌前。平凡的夜，也可以孕育新的开始。'],['花与风','街边的花又开了。我想起，从前总觉得生活必须匆忙向前。']]};
function setupMemory(){const buttons=[...stage.querySelectorAll('[data-memory]')];let notes=memories[state.route];const refresh=()=>{let d=$('#memoryDots');if(d)d.textContent=[0,1,2].map(i=>state.memory.has(i)?'✦':'○').join('  ');let nextBtn=$('#memoryNext');if(nextBtn){nextBtn.disabled=state.memory.size<2;nextBtn.textContent=state.memory.size>=2?'我想继续这段人生　→':'触摸至少两处回忆　→'}};buttons.forEach(btn=>btn.addEventListener('click',()=>{let i=+btn.dataset.memory;if(state.memory.has(i))return;state.memory.add(i);btn.disabled=true;let pop=$('#memoryPop');pop.innerHTML=`<div class="memory-pop"><small>MEMORY 0${i+1} / ${notes[i][0]}</small><p>${notes[i][1]}</p></div>`;const w=$('#world');if(w){w.style.setProperty('--zoom','1.14');w.style.filter='brightness(1.12)';setTimeout(()=>{if($('#world')===w){w.style.setProperty('--zoom','1.03');w.style.filter=''}},720)}sound(470+i*80);refresh()}));$('#memoryNext').addEventListener('click',()=>{if(state.memory.size>=2)next('decision')});refresh()}
function setupSwipe(){let area=$('#swipeZone'),startY=null,finished=false;function go(){if(finished)return;finished=true;sound(740);let p=$('.page',stage);p?.querySelector('.tunnel')?.classList.add('warping');setTimeout(()=>render('result'),520)}area.addEventListener('pointerdown',e=>{startY=e.clientY;area.setPointerCapture(e.pointerId)});area.addEventListener('pointerup',e=>{if(startY!==null&&startY-e.clientY>65)go();startY=null});area.addEventListener('wheel',e=>{if(e.deltaY>20)go()},{passive:true});$('#warpSkip').addEventListener('click',go)}
function restart(){state.route=null;state.action=null;state.ending=null;state.memory=new Set();state.dayIndex=0;state.dayRevealed=false;state.experiences=[];sound(440);render('intro')}
$('#sound').addEventListener('click',()=>{state.sound=!state.sound;$('#sound').textContent=state.sound?'♫':'♪';$('#sound').setAttribute('aria-label',state.sound?'关闭音效':'开启音效');if(state.sound){sound(590);toast('音效已开启')}else toast('音效已关闭')});$('#restart').addEventListener('click',restart);
// The poster is painted locally; it works offline, with no network or third-party API.
function makePoster(){let canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;let c=canvas.getContext('2d'),e=endingData[state.ending];const g=c.createLinearGradient(0,0,0,1920);g.addColorStop(0,'#0a1930');g.addColorStop(.52,state.ending==='light'?'#516b82':state.ending==='maker'?'#54796e':'#595a82');g.addColorStop(1,'#071625');c.fillStyle=g;c.fillRect(0,0,1080,1920);let rand=()=>Math.random();for(let i=0;i<180;i++){c.beginPath();c.arc(rand()*1080,rand()*1190,rand()*2+.4,0,Math.PI*2);c.fillStyle='rgba(255,231,184,.55)';c.fill()}let halo=c.createRadialGradient(690,690,20,690,690,440);halo.addColorStop(0,'#f6ce97a0');halo.addColorStop(1,'#f6ce9700');c.fillStyle=halo;c.fillRect(0,270,1080,900);c.fillStyle='#f4d5a5';c.beginPath();c.arc(710,670,110,0,Math.PI*2);c.fill();c.fillStyle='#213b4c';if(state.ending==='light'){for(let i=0;i<14;i++){let x=i*88-28,y=730+(i%4)*39;c.fillRect(x,y,88,420);c.fillStyle='#d7bc8d';for(let j=0;j<4;j++)c.fillRect(x+14+j*15,y+23,6,9);c.fillStyle='#213b4c'}}else if(state.ending==='maker'){c.fillStyle='#2d5b57';c.beginPath();c.moveTo(0,1040);c.quadraticCurveTo(470,680,1080,1040);c.lineTo(1080,1250);c.lineTo(0,1250);c.fill();c.fillStyle='#ccb492';c.fillRect(340,845,380,310);c.fillStyle='#253f44';c.beginPath();c.moveTo(290,853);c.lineTo(530,658);c.lineTo(772,853);c.fill()}else{c.fillStyle='#394567';c.beginPath();c.moveTo(0,1050);c.quadraticCurveTo(240,720,530,980);c.quadraticCurveTo(840,770,1080,970);c.lineTo(1080,1260);c.lineTo(0,1260);c.fill()}
// Back-facing illustrated figure.
c.fillStyle='#0d1a2a99';c.beginPath();c.ellipse(540,1296,150,20,0,0,Math.PI*2);c.fill();if(girlImg.complete&&girlImg.naturalWidth){let gh=470,gw=gh*girlImg.naturalWidth/girlImg.naturalHeight;c.save();c.shadowColor='#0008';c.shadowBlur=30;c.shadowOffsetY=14;c.drawImage(girlImg,540-gw/2,1300-gh,gw,gh);c.restore()}
c.strokeStyle='#e5c69a88';c.lineWidth=2;c.strokeRect(52,52,976,1816);c.textAlign='center';c.fillStyle='#f0d2a0';c.font='31px Georgia,serif';c.fillText('S O M E W H E R E  ·  E L S E',540,151);c.font='34px sans-serif';c.fillStyle='#d8e2e3';c.fillText('如果那天，我选择了另一条路',540,228);c.fillStyle='#e4c99f';c.font='28px Georgia,serif';c.fillText('MY PARALLEL LIFE',540,1382);c.fillStyle='#fff1da';c.font='102px "Songti SC","STSong","SimSun",serif';c.fillText(e.name,540,1511);c.fillStyle=e.tone;c.font='28px Georgia,serif';c.fillText(e.en,540,1570);c.fillStyle='#fff1da';c.font='39px "Songti SC","STSong","SimSun",serif';e.quote.split('\n').forEach((line,i)=>c.fillText(line,540,1660+i*56));c.fillStyle='#d5c8b6';c.font='24px sans-serif';c.fillText(state.route==='near'?'桂花、晚风、灯火，都是我的生活。':'乐声、灯海、远方，都是我的生活。',540,1830);return canvas}
function openPoster(){try{const canvas=makePoster();canvas.toBlob(blob=>{if(!blob){toast('海报生成失败，请重试');return}if(state.posterUrl)URL.revokeObjectURL(state.posterUrl);state.posterUrl=URL.createObjectURL(blob);$('#posterImg').src=state.posterUrl;$('#posterModal').classList.add('open')},'image/png')}catch(e){toast('海报生成失败，请使用较新的浏览器')}}function closePoster(){ $('#posterModal').classList.remove('open');if(state.posterUrl){URL.revokeObjectURL(state.posterUrl);state.posterUrl=null}}$('#closePoster').addEventListener('click',closePoster);$('#posterModal').addEventListener('click',e=>{if(e.target.id==='posterModal')closePoster()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePoster()});$('#savePoster').addEventListener('click',()=>{if(!state.posterUrl)return;let a=document.createElement('a');a.href=state.posterUrl;a.download='我的平行人生-'+endingData[state.ending].name+'.png';document.body.appendChild(a);a.click();a.remove();toast('已请求下载，也可以长按图片保存')});
render('intro',true);
