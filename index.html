<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1828">
<meta name="description" content="第一人称互动叙事H5：如果那天，我选择了另一条路。两条人生路线，十一段可以亲手触碰的日常。">
<title>如果那天，我选择了另一条路</title>
<link rel="stylesheet" href="css/style.css?v=202610301702">
<link rel="stylesheet" href="css/scenes.css?v=202610301702">
<link rel="stylesheet" href="css/art.css?v=202610301702">
</head>
<body>
<main class="app" id="app" aria-label="如果那天，我选择了另一条路">
  <div id="stage"></div>
  <div id="hits"></div>

  <div class="topbar">
    <div class="brand"><i>✦</i>另一条路</div>
    <div class="tools">
      <button class="tool" id="sound" aria-label="关闭声音"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="w" d="M16 8.5q2 3.5 0 7M18.5 6q4 6 0 12"/><path class="x" d="M16 9l6 6M22 9l-6 6"/></svg></button>
      <button class="tool" id="menuBtn" aria-label="菜单"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
    </div>
  </div>
  <div class="progress" id="progress"></div>

  <section class="cap hidden" id="cap" aria-live="polite">
    <div class="cap-meta"></div>
    <div class="cap-lines"></div>
    <div class="cap-choices"></div>
    <div class="cap-foot">
      <span class="cap-hint"></span>
      <button class="skip" id="skipAct" hidden>跳过互动</button>
      <button class="next" id="next" hidden>继续</button>
    </div>
  </section>

  <div class="chapter" id="chapter" role="status"></div>

  <div class="title-ui" id="titleUi">
    <div class="t-eyebrow">A STORY THROUGH MY EYES</div>
    <h1>如果那天，<br><em>我选择了另一条路</em></h1>
    <p>一封来自平行时空的信，两种人生。<br>约 6 分钟 · 建议打开声音，竖屏体验</p>
    <button class="primary" id="start">打开那封信</button>
    <button class="secondary" id="resume" hidden></button>
  </div>

  <div class="menu" id="menu" role="dialog" aria-label="菜单">
    <div class="sheet">
      <div class="sheet-head">菜单<button id="menuClose" aria-label="关闭">×</button></div>
      <button id="mRoad">回到分岔路口，重新选择</button>
      <button id="mHome">直接体验 · 留在家乡</button>
      <button id="mFar">直接体验 · 奔赴远方</button>
      <button id="mRestart" class="danger">清除进度，从头开始</button>
    </div>
  </div>

  <div class="poster-modal" id="posterModal" role="dialog" aria-modal="true" aria-label="结局海报">
    <div class="poster-head"><span>我的平行人生 · 结局海报</span><button id="closePoster" aria-label="关闭">×</button></div>
    <div class="poster-wrap"><img id="posterImg" alt="我的结局海报"><div class="poster-busy">正在绘制海报…</div></div>
    <p class="poster-tip">手机：长按图片保存到相册　电脑：点下方按钮下载</p>
    <button class="primary" id="savePoster">下载高清海报（PNG）</button>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <div class="loader" id="loader"><div class="ld-ring"></div><p>正在展开那封信…</p></div>
</main>
<noscript><p style="color:#fff;padding:24px">这个互动故事需要开启 JavaScript。</p></noscript>

<script src="js/music.js?v=202610301702"></script>
<script src="js/story.js?v=202610301702"></script>
<script src="js/scenes-common.js?v=202610301702"></script>
<script src="js/scenes-home.js?v=202610301702"></script>
<script src="js/scenes-far.js?v=202610301702"></script>
<script src="js/scenes-art.js?v=202610301702"></script>
<script src="js/poster.js?v=202610301702"></script>
<script src="js/engine.js?v=202610301702"></script>
</body>
</html>
