<style>
/* =========================================================

:root {

}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #070d17; color: var(--ivory); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

.arrive-sign { opacity: .6; } .f-slow .arrive-sign { animation: blink 1s ease-in-out infinite; }

/* 音乐会 */
.house-lights { transition: opacity 2.4s; } .f-dim .house-lights { opacity: .12; }
.house-dim { opacity: 0; transition: opacity 2.4s; pointer-events: none; } .f-dim .house-dim { opacity: .5; }
.spots { opacity: 0; transition: opacity 1.4s; } .f-spot .spots { opacity: 1; }
.stage-wash { transition: opacity 1.4s; } .f-dim .stage-wash { opacity: .3; } .f-spot .stage-wash { opacity: 1.6; }
.players { transition: filter 1.4s; filter: brightness(.6); } .f-spot .players { filter: brightness(1.15); }
.bow { transform-box: fill-box; transform-origin: 0 50%; }
.f-play .bowArm { animation: bowStroke 1.3s ease-in-out infinite alternate; animation-delay: var(--d); }
.f-play .bowArm.h { animation-name: bowStrokeH; }
@keyframes bowStroke { from { transform: translate(-3px, -4px); } to { transform: translate(4px, 5px); } }
@keyframes bowStrokeH { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
.f-play .player { animation: sway 2.8s ease-in-out infinite alternate; animation-delay: var(--d); }
@keyframes bowing { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
@keyframes sway { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }
.player { transform-box: fill-box; transform-origin: 50% 100%; }
.aud { animation: audSway 6s ease-in-out infinite alternate; animation-delay: var(--d); }
@keyframes audSway { to { transform: translateX(2px) rotate(.6deg); } }
.f-play .fall.dust { opacity: 1; }

/* 美术馆 / 咖啡馆 */
.pan-strip { transform: translateX(calc(var(--pan, 0) * -400px)); transition: transform 1.6s var(--ease); }
.visitors.b { opacity: 0; }
.f-time .visitors.a { animation: swapOut 7s ease-in-out infinite alternate; }
.f-time .visitors.b { animation: swapIn 7s ease-in-out infinite alternate; }
@keyframes swapOut { 0%, 35% { opacity: 1; } 65%, 100% { opacity: 0; } }
@keyframes swapIn { 0%, 35% { opacity: 0; } 65%, 100% { opacity: 1; } }
.ped { animation: pedWalk var(--pt) linear infinite; animation-delay: var(--pd); }
.ped:nth-child(even) { animation-direction: reverse; }
@keyframes pedWalk { from { transform: translateX(-40px); } to { transform: translateX(440px); } }

/* 夜宵 */
.shot-table .art { animation: orbit 14s ease-in-out infinite alternate; transform-origin: 50% 60%; }
@keyframes orbit { from { transform: translateX(-1.5%) rotate(-.4deg); } to { transform: translateX(1.5%) rotate(.4deg); } }
.f-cheers .cup { animation: clink 1.6s cubic-bezier(.3, .7, .3, 1) forwards; }
@keyframes clink { 0% { transform: none; } 45%, 55% { transform: translate(var(--cx), var(--cy)) rotate(4deg); } 100% { transform: none; } }
.spark { opacity: 0; }
.f-cheers .spark { animation: sparkle 1.6s ease forwards; }
@keyframes sparkle { 0%, 40% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
.f-laugh .head.talk { animation-duration: 1.1s; }
.ask-bubble { opacity: 0; transform-box: fill-box; transform-origin: 30% 100%; transform: scale(.8); transition: .6s cubic-bezier(.3, 1.4, .5, 1); }
.f-ask .ask-bubble { opacity: 1; transform: none; }

.f-doors .fp-phone { opacity: 0; transform: translate(-50%, 90%); }

</style>
</head>

      tone(c[0] / 2, t, beat * 4, { type: 'sawtooth', vol: 0.025, attack: 0.6, lp: 600, dest: bus });
      m.forEach((f, i) => { tone(f, t + i * beat, beat * 1.6, { type: 'sine', vol: 0.06, attack: 0.01, dest: bus }); tone(f, t + i * beat, beat * 1.6, { type: 'sine', vol: 0.03, dest: rev }); });
      bar++;
      music.timer = setTimeout(sched, beat * 4 * 1000);
    };
    music = { bus, timer: 0, stop: () => { alive = false; clearTimeout(music.timer); bus.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.6); setTimeout(() => bus.disconnect(), 3000); } };
    sched();
  }
  function stopMusic() { if (music) { music.stop(); music = null; } }


  /* ---------------- 背景音乐（原创、程序生成） ---------------- */
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  // 每个主题：速度、和弦（MIDI 音高）、琶音型、铺底音色、是否有轻柔低音脉动
  const THEMES = {
    night: { bpm: 60, vol: .5, chords: [[57, 60, 64, 69], [53, 57, 60, 65], [48, 55, 60, 64], [55, 59, 62, 67]], arp: [3, null, 2, null, 1, null, 2, null], lead: [76, null, 74, null, 72, null, 71, null], leadEvery: 2, pad: .05 },
    home: { bpm: 72, vol: .55, chords: [[50, 57, 62, 66], [47, 54, 59, 62], [43, 50, 55, 59], [45, 52, 57, 61]], arp: [0, 2, 3, 2, 1, 2, 3, 2], lead: [78, 76, 74, null, 73, 74, 76, null], leadEvery: 2, pad: .045 },
    far: { bpm: 84, vol: .5, chords: [[48, 55, 60, 63], [44, 51, 56, 60], [51, 58, 63, 67], [46, 53, 58, 62]], arp: [0, 3, 2, 3, 1, 3, 2, 3], lead: [75, null, 74, 72, null, 70, 72, null], leadEvery: 2, pad: .04, pulse: true },
    end: { bpm: 58, vol: .55, chords: [[41, 53, 57, 60], [40, 52, 55, 60], [38, 50, 57, 62], [46, 53, 58, 62]], arp: [1, null, 2, 3, null, 2, null, null], lead: [77, null, 76, null, 74, null, 72, null], leadEvery: 1, pad: .055 }
  };
  function voice(f, t0, dur, vol, type, dest, att) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + (att || .012)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(dest); o.start(t0); o.stop(t0 + dur + .05);
    return g;
  }
  function piano(f, t0, dur, vol, out) {
    const g = voice(f, t0, dur, vol, 'triangle', out);
    voice(f * 2, t0, dur * .45, vol * .25, 'sine', out);
    g.connect(reverb);
  }
  function startTheme(name, horizon) {
    const T = THEMES[name]; if (!T) return null;
    const out = ctx.createGain(); out.gain.value = 0.0001; out.connect(bgmBus);
    out.gain.exponentialRampToValueAtTime(T.vol, ctx.currentTime + 3);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(out);
    const step = 60 / T.bpm / 2; // 八分音符
    let next = ctx.currentTime + .1, i = 0, bar = 0;
    const tick = () => {
      while (next < ctx.currentTime + (horizon || 1.2)) {
        const chord = T.chords[bar % T.chords.length], k = i % 8;
        if (k === 0) {
          chord.forEach((m, j) => { const g = voice(hz(m), next, step * 8.6, T.pad / (j ? 1.5 : 1), j ? 'sine' : 'triangle', lp, 1.2); g.connect(reverb); });
          voice(hz(chord[0] - 12), next, step * 8, T.pad * 1.2, 'sine', out, .4);
        }
        const a = T.arp[k]; if (a != null) piano(hz(chord[a] + 12), next, step * 5, .045, out);
        if (T.pulse && k % 2 === 0) voice(hz(chord[0] - 12), next, step * .9, .03, 'sine', out, .01);
        if (bar % (T.leadEvery * 2) >= T.leadEvery * 2 - T.leadEvery && T.lead[k] != null) piano(hz(T.lead[k]), next + .01, step * 6, .05, out);
        next += step; i++; if (k === 7) bar++;
      }
    };
    tick();
    if (horizon) return { name };
    const timer = setInterval(tick, 250);
    return { name, stop() { clearInterval(timer); out.gain.cancelScheduledValues(ctx.currentTime); out.gain.setTargetAtTime(0.0001, ctx.currentTime, .9); setTimeout(() => out.disconnect(), 5000); } };
  }
  function theme(name) {
    wantTheme = name;
    if (!ctx) return;
    if (music) { stopMusic(); }
    duck(false);
    if (bgm && bgm.name === name) return;
    if (bgm) bgm.stop();
    bgm = name ? startTheme(name) : null;
  }
  function duck(down) { if (bgmBus) bgmBus.gain.setTargetAtTime(down ? 0.0001 : BGM_GAIN, ctx.currentTime, down ? .6 : 1.5); }

  function sfx(name) {
    if (!ctx || !on) { if (name === 'stopmusic') { stopMusic(); duck(false); } return; }
    const t = ctx.currentTime + 0.01;
    switch (name) {
      case 'tap': tone(880, t, 0.12, { vol: 0.03 }); break;
      case 'chime': bellTone(N.A5, t, 1.6, 0.06); bellTone(N.E5, t + 0.12, 1.8, 0.05); break;
      case 'paper': noise(t, 0.6, { f: 3000, ft: 'bandpass', vol: 0.05, attack: 0.1 }); noise(t + 0.4, 0.5, { f: 2200, ft: 'bandpass', vol: 0.04 }); break;
      case 'hum': tone(330, t, 1.1, { vol: 0.03, slide: 520, attack: 0.3 }); break;
      case 'choose': tone(N.D5, t, 0.5, { vol: 0.06 }); tone(N.A5, t + 0.14, 0.9, { vol: 0.06 }); break;
      case 'bell': for (let i = 0; i < 14; i++) tone(i % 2 ? 1180 : 1320, t + i * 0.09, 0.12, { type: 'square', vol: 0.012, lp: 2400 }); break;
      case 'flash': noise(t, 1.2, { f: 400, fTo: 4000, ft: 'bandpass', vol: 0.05, attack: 0.5 }); bellTone(N.D5, t + 0.4, 2.4, 0.03); break;
      case 'door': noise(t, 0.5, { f: 500, vol: 0.06 }); tone(140, t, 0.4, { vol: 0.04, slide: 110 }); bellTone(1400, t + 0.15, 1.2, 0.04); break;
      case 'cloth': noise(t, 0.45, { f: 1800, ft: 'bandpass', vol: 0.035, attack: 0.12 }); break;
      case 'click': tone(1800, t, 0.04, { type: 'square', vol: 0.03, lp: 3000 }); tone(900, t + 0.05, 0.05, { vol: 0.03 }); break;
      case 'send': tone(600, t, 0.18, { vol: 0.05, slide: 1200 }); break;
      case 'msg': tone(N.E5, t, 0.25, { vol: 0.05 }); tone(N.A5, t + 0.16, 0.4, { vol: 0.05 }); break;
      case 'arrive': [N.E5, N.C5 || 523, N.G4].forEach((f, i) => tone(f, t + i * 0.32, 0.5, { vol: 0.05 })); break;
      case 'doors': tone(N.G5, t, 0.3, { vol: 0.04 }); tone(N.E5, t + 0.3, 0.4, { vol: 0.04 }); noise(t + 0.5, 1.2, { f: 700, vol: 0.05, attack: 0.3 }); break;
      case 'roll': noise(t, 0.7, { f: 260, vol: 0.06, attack: 0.08 }); break;
      case 'music': duck(true); startMusic(); break;
      case 'stopmusic': stopMusic(); duck(false); break;
      case 'wind': noise(t, 2.6, { f: 300, fTo: 900, ft: 'bandpass', q: 0.6, vol: 0.06, attack: 1 }); break;
      case 'cup': bellTone(2100, t, 0.5, 0.04); break;
      case 'clink': bellTone(2600, t, 0.8, 0.05); bellTone(3100, t + 0.06, 0.8, 0.04); bellTone(2350, t + 0.11, 0.8, 0.04); break;
      case 'step': noise(t, 0.18, { f: 500, vol: 0.03 }); break;
      case 'ending': [N.D4, N.Fs4, N.A4, N.D5].forEach((f, i) => tone(f, t + i * 0.18, 3, { type: 'triangle', vol: 0.04, attack: 0.05 })); break;
    }
  }
  /* 开发用：离线渲染一段主题为 WAV（用于试听与检查音量），不影响正常播放 */
  async function renderTheme(name, secs) {
    const keep = [ctx, master, reverb, bgmBus];
    ctx = new OfflineAudioContext(2, 44100 * secs, 44100);
    master = ctx.createGain(); master.gain.value = .8; master.connect(ctx.destination);
    reverb = makeReverb(); bgmBus = ctx.createGain(); bgmBus.gain.value = BGM_GAIN; bgmBus.connect(master);
    startTheme(name, secs);
    const buf = await ctx.startRendering();
    [ctx, master, reverb, bgmBus] = keep;
    return buf;
  }
  window.AUDIO = { unlock, toggle, sfx, theme, isOn: () => on, renderTheme };
})();

      let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      for (let i = 0; i < 26; i++) { const x = rnd() * 340, y = rnd() * 340, r = 30 + rnd() * 90; const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(200,180,150,${0.05 + rnd() * 0.06})`); gr.addColorStop(1, 'rgba(200,180,150,0)'); g.fillStyle = gr; g.fillRect(0, 0, 340, 340); }

      document.documentElement.style.setProperty('--paper-tex', `url(${c.toDataURL('image/png')})`);

  })();

  /* ---------- 工具 ---------- */
  const U = {};

  U.rg = (id, stops, cx, cy, r) => `<radialGradient id="${id}" cx="${cx || .5}" cy="${cy || .5}" r="${r || .5}">${stops.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}"${a != null ? ` stop-opacity="${a}"` : ''}/>`).join('')}</radialGradient>`;
  /* 飘落物：osm 桂花 / petal 樱花瓣 / leaf 树叶 / snow 雪 */
  U.fall = (kind, n, o) => {
    o = o || {};

      const t = (o.t0 || 10) + ((i * 37) % 10) / 10 * ((o.t1 || 16) - (o.t0 || 10));
      const x = (o.x0 || 0) + ((i * 61 + 13) % 100) / 100 * ((o.x1 || 100) - (o.x0 || 0));

    let h = `<ellipse cx="${cx}" cy="${cy}" rx="${r * 1.05}" ry="${r * .8}" fill="#f3d6d4" opacity=".55"/>`;
    for (let i = 0; i < n; i++) {
      const a = rnd() * 6.283, d = Math.sqrt(rnd()) * r;
      h += `<circle cx="${(cx + Math.cos(a) * d).toFixed(1)}" cy="${(cy + Math.sin(a) * d * .78).toFixed(1)}" r="${(r * .16 + rnd() * r * .22).toFixed(1)}" fill="${PINK[Math.floor(rnd() * PINK.length)]}" opacity="${(.78 + rnd() * .22).toFixed(2)}"/>`;
    }
    for (let i = 0; i < n / 3; i++) { const a = rnd() * 6.283, d = rnd() * r; h += `<circle cx="${(cx + Math.cos(a) * d).toFixed(1)}" cy="${(cy + Math.sin(a) * d * .7).toFixed(1)}" r="1.3" fill="#fffaf6"/>`; }
    return h;
  }
  function seeded(seed) { let s = seed * 9301 + 49297; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
  function cherryTree(x, gy, sc, seed, big) {
    const rnd = seeded(seed);
    const br = [[0, -112, -112, -176, -54, -150], [3, -140, -64, -246, -26, -206], [8, -150, 54, -252, 32, -210], [10, -122, 122, -168, 66, -148], [6, -150, 6, -274, 0, -220]];
    let branches = '', clusters = '';
    br.forEach(([x0, y0, x1, y1, qx, qy]) => {
      branches += `<path d="M${x0} ${y0}Q${qx} ${qy} ${x1} ${y1}" stroke="#4d3b3b" stroke-width="6" fill="none" stroke-linecap="round"/>`;
      branches += `<path d="M${(x0 + x1) / 2} ${(y0 + y1) / 2}q${(x1 - x0) * .3} ${-20 - rnd() * 20} ${(x1 - x0) * .55} ${-12 - rnd() * 20}" stroke="#4d3b3b" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
      [[.55, 30], [.85, 38], [1, 34]].forEach(([t, r]) => {
        const cx = x0 + (x1 - x0) * t + (rnd() - .5) * 16, cy = y0 + (y1 - y0) * t + (rnd() - .5) * 14;
        clusters += blossom(cx, cy, r, big ? 22 : 16, rnd);
      });
    });
    clusters += blossom(0, -230, 46, 26, rnd);
    return `<g transform="translate(${x} ${gy}) scale(${sc})">
      <path d="M-11 0Q-14 -62 -4 -112Q0 -132 5 -152L13 -150Q9 -122 12 -62Q12 -22 15 0Z" fill="#4a3838"/>
      <g class="canopy" style="animation-delay:-${(seed * 1.3).toFixed(1)}s">${branches}${clusters}</g></g>`;
  }
  /* 抬头时看到的满天枝桠 */
  function skyBranches() {
    const rnd = seeded(11);
    let h = '';
    [[-10, 250, 210, 40, 70, 160], [410, 230, 190, 30, 330, 150], [-10, 90, 150, -10, 60, 40], [410, 110, 260, 0, 350, 60]].forEach(([x0, y0, x1, y1, qx, qy]) => {
      h += `<path d="M${x0} ${y0}Q${qx} ${qy} ${x1} ${y1}" stroke="#4d3b3b" stroke-width="7" fill="none" stroke-linecap="round"/>`;
      for (let k = 1; k <= 5; k++) { const t = k / 5; const cx = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * qx + t * t * x1, cy = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * qy + t * t * y1; h += `<path d="M${cx} ${cy}l${(rnd() - .5) * 50} ${-10 - rnd() * 30}" stroke="#4d3b3b" stroke-width="2.4" stroke-linecap="round"/>` + blossom(cx + (rnd() - .5) * 30, cy - 10 - rnd() * 20, 26 + rnd() * 14, 18, rnd); }
    });
    return h;
  }

  /* ---------------- 第四幕 樱花 ---------------- */
  SCENES.cherry = {

        <g transform="translate(236 600)"><path d="M-30 -96H60L52 -40H-22Z" fill="none" stroke="#8b939c" stroke-width="3"/><path d="M-26 -88h80M-24 -72h76M-22 -56h72" stroke="#8b939c" stroke-width="1.5"/><path d="M-30 -96L-44 -112" stroke="#8b939c" stroke-width="3"/><circle cx="-14" cy="-6" r="6" fill="#4a4f58"/><circle cx="44" cy="-6" r="6" fill="#4a4f58"/><path d="M-22 -40L-14 -12H44L52 -40" fill="none" stroke="#8b939c" stroke-width="3"/><rect x="-14" y="-110" width="18" height="22" fill="#e2c57d"/><circle cx="20" cy="-102" r="10" fill="#d9844f"/><rect x="34" y="-116" width="12" height="28" fill="#8fae9c"/></g>
        ${fam.dad({ x: 320, y: 560, s: .95, view: 'front', arm: 'up' })}`);
      const tidy = U.svg(`<defs>${U.lg('td', [[0, '#efe4d2'], [1, '#d9c8b0']])}${U.lg('beam', [[0, '#fff6dc', .7], [1, '#fff6dc', 0]], 1, 1)}</defs>

      const kitchen = U.svg(`<defs>${U.lg('kt', [[0, '#e6c9a4'], [1, '#c99e74']])}${U.rg('kl', [[0, '#ffe6b0', .8], [1, '#ffe6b0', 0]])}</defs>

        <rect x="260" y="260" width="90" height="70" fill="#5a6f86"/><rect x="266" y="266" width="78" height="58" fill="#e7a87a" opacity=".85"/>

        <path d="M0 550H400V780H0Z" fill="#6e5a4a"/>`);

        <rect width="400" height="780" fill="url(#sf)"/>
        <rect x="60" y="150" width="130" height="170" fill="#1c2438"/><rect x="66" y="156" width="118" height="158" fill="#24314e"/>${U.stars(14, 150).replace(/cx="(\d+)"/g, (m, x) => `cx="${70 + (+x % 110)}"`).replace(/cy="(\d+)"/g, (m, y) => `cy="${160 + (+y % 140)}"`)}
        <circle cx="330" cy="260" r="120" fill="url(#sl)"/><path d="M330 220v120" stroke="#5a4a3a" stroke-width="4"/><path d="M304 220h52l-10 -40h-32z" fill="#e9c88f"/>
        <rect x="210" y="300" width="90" height="56" fill="#141822"/><rect x="190" y="356" width="130" height="40" fill="#5a4636"/>
        <path d="M0 420H400V780H0Z" fill="#4a3f42"/>
        <path d="M40 560Q200 520 360 560L370 600H30Z" fill="#7d6250"/><ellipse cx="200" cy="560" rx="150" ry="18" fill="#8c705c"/>
        <rect x="150" y="536" width="30" height="20" rx="4" fill="#e8dccb"/><circle cx="240" cy="544" r="12" fill="#d9844f"/>`);

        <div class="post p3"><div class="ph gal">${miniGallery()}</div><div class="pcap">周末去了美术馆</div></div></div>`;
      return {
        cam: U.shot('market', market) + U.shot('tidy', tidy, U.fall('glow', 12, { t0: 14, t1: 20, s0: 2, s1: 3 })) + U.shot('kitchen', kitchen) + U.shot('sofa', sofa),

  function miniCity() { return `<svg viewBox="0 0 120 80" preserveAspectRatio="xMidYMid slice"><rect width="120" height="80" fill="#1b2b4a"/><circle cx="90" cy="18" r="8" fill="#f6e2b8"/><g fill="#33476a">${[[0, 30, 14], [16, 20, 12], [30, 36, 16], [48, 14, 14], [64, 28, 12], [78, 22, 16], [96, 34, 14], [110, 26, 10]].map(([x, y, w]) => `<rect x="${x}" y="${y}" width="${w}" height="${80 - y}"/>`).join('')}</g><g fill="#ffd59a">${Array.from({ length: 30 }, (_, i) => `<rect x="${(i * 13) % 118}" y="${30 + (i * 7) % 46}" width="2" height="2.5"/>`).join('')}</g><path d="M0 70h120" stroke="#f3b27a" stroke-width="3" opacity=".6"/></svg>`; }

      ${U.tree(20, 640, 1.5, 'osm')}${U.tree(390, 630, 1.4, 'osm')}
      ${withHero ? F.heroineBack({ x: 200, y: 586, s: .5, walk: true }) : ''}`);
  }
  window.HOME_NIGHT = homeNight;
})();

</script>
<script>
/* =========================================================
   scenes-far.js — 远方线六幕 + 逐光者结局
   色彩：深海蓝、城市灰蓝、暖橙灯光、音乐厅香槟金、美术馆米白、出租屋柔和暖黄
   ========================================================= */
(function () {
  'use strict';
  const U = window.SCN, F = window.FIG, H = F.HERO;
  const person = (o, i) => F.fig(Object.assign({ hs: ['short', 'bob', 'long', 'pony', 'short'][i % 5], hair: ['#2a2a30', '#3a2f2c', '#1f2430', '#4a3a30', '#2c2c2c'][i % 5], coat: ['#4a5a74', '#7a5a52', '#5f6f5a', '#8a7a6a', '#3d4a5f', '#6a5470'][i % 6] }, o));
  const skyline = (w, base, seed, col, win) => {
    let s = '', x = 0, k = seed;
    while (x < w) { const bw = 24 + (k * 37) % 40, bh = 90 + (k * 53) % 170; s += `<rect x="${x}" y="${base - bh}" width="${bw}" height="${bh + 40}" fill="${col}"/>`; if (win) for (let j = 0; j < bh / 14; j++) for (let q = 0; q < bw / 9 - 1; q++) if ((j * 7 + q * 3 + k) % 9 < 2) s += `<rect x="${x + 4 + q * 9}" y="${base - bh + 8 + j * 14}" width="4" height="6" fill="${win}" opacity="${.5 + ((j + q + k) % 4) * .12}"/>`; x += bw + 2; k++; }
    return s;
  };

  /* =========================================================
     出租屋（第一幕 / 第六幕共用同一套房型，保证门窗家具位置一致）
     ========================================================= */
  function roomArt(lived) {
    const planks = Array.from({ length: 9 }, (_, i) => `<path d="M${70 + i * 32.5} 470L${-60 + i * 65} 780" stroke="#8a6a4f" stroke-width="1.2" opacity=".5"/>`).join('');
    return U.svg(`<defs>${U.lg('rmSkyD', [[0, '#9db4cc'], [.55, '#efc39a'], [1, '#f6d6ae']])}${U.lg('rmSkyN', [[0, '#0f1a30'], [1, '#2b3555']])}${U.rg('rmLamp', [[0, '#ffe2a6', .85], [1, '#ffd08a', 0]])}${U.rg('rmCeil', [[0, '#fff0cc', .7], [1, '#ffe6b0', 0]])}${U.lg('rmWall', [[0, '#e3d6c2'], [1, '#d2c2aa']])}
        <clipPath id="rmWin${lived ? 'L' : 'F'}"><rect x="152" y="202" width="96" height="126"/></clipPath></defs>
      <!-- 墙与地面 -->
      <path d="M0 0H400V90L330 170H70L0 90Z" fill="#cfc3b0"/>
      <path d="M70 170H330V470H70Z" fill="url(#rmWall)"/>
      <path d="M0 90L70 170V470L0 560Z" fill="#c8b9a2"/><path d="M400 90L330 170V470L400 560Z" fill="#c2b29a"/>
      <path d="M70 470H330L400 560V780H0V560Z" fill="#b48c68"/>${planks}
      <path d="M70 470H330" stroke="#a58466" stroke-width="3"/>
      <!-- 窗 -->
      <g clip-path="url(#rmWin${lived ? 'L' : 'F'})">
        <rect x="150" y="200" width="100" height="130" fill="url(#rmSkyD)" class="sky-day"/>
        <rect x="150" y="200" width="100" height="130" fill="url(#rmSkyN)" class="sky-night"/>
        <g class="win-city">${[[150, 290, 18], [170, 262, 16], [188, 300, 14], [204, 250, 20], [226, 282, 14], [242, 270, 12]].map(([x, y, w]) => `<rect x="${x}" y="${y}" width="${w}" height="${340 - y}" fill="#3a4766"/>`).join('')}</g>
        <g class="win-lights">${Array.from({ length: 26 }, (_, i) => `<rect x="${154 + (i * 13) % 92}" y="${266 + (i * 17) % 66}" width="3" height="4" fill="#ffd79a" style="transition-delay:${(i % 9) * .35}s"/>`).join('')}</g>
      </g>
      <rect x="146" y="196" width="108" height="138" fill="none" stroke="#f1e8da" stroke-width="8"/><path d="M200 200V330M150 266H250" stroke="#f1e8da" stroke-width="4"/>
      <rect x="140" y="332" width="120" height="8" fill="#efe5d6"/>
      <!-- 天花板灯 -->
      <path d="M200 0V96" stroke="#7a6a5a" stroke-width="2"/><path d="M182 96h36l-6 14h-24z" fill="#efe2cc"/>
      <circle class="ceil-glow" cx="200" cy="140" r="260" fill="url(#rmCeil)"/>
      <!-- 冰箱（后墙左） -->
      <rect x="76" y="340" width="52" height="130" rx="4" fill="#e9e7e2"/><path d="M76 386H128" stroke="#c9c6bf" stroke-width="2"/><rect x="120" y="350" width="3" height="26" fill="#b9b6ae"/><rect x="120" y="394" width="3" height="40" fill="#b9b6ae"/>

<script>
/* =========================================================
   poster.js — 1080×1920 结局海报（本地 Canvas 绘制，离线可用）
   背景直接复用结局场景的 SVG（主角背影 + 家乡夜街 / 城市夜景），再叠加文字
   ========================================================= */
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  let url = null, route = null;
  const SERIF = '"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif';

  function svgImage(svg, w, h) {
    const s = svg.replace('<svg class="art ', `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" class="art `);
    return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); });
  }

  async function draw(r) {
    const E = STORY.endings[r];
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1920;
    const g = c.getContext('2d');
    g.fillStyle = '#0a1322'; g.fillRect(0, 0, 1080, 1920);
    try {
      const art = r === 'home' ? window.HOME_NIGHT(true) : window.CITY_NIGHT(true);
      const img = await svgImage(art, 1080, 1300);
      g.drawImage(img, 0, 0, 1080, 1300);
    } catch (e) { /* 背景绘制失败时保留纯色底，文字照常输出 */ }
    // 飘落的桂花 / 城市微光（少量点缀）
    let seed = r === 'home' ? 3 : 9; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 46; i++) { g.fillStyle = r === 'home' ? `rgba(246,199,102,${.4 + rnd() * .5})` : `rgba(255,226,170,${.25 + rnd() * .4})`; g.beginPath(); g.arc(rnd() * 1080, rnd() * 1150, 2 + rnd() * 4, 0, 7); g.fill(); }
    const fade = g.createLinearGradient(0, 860, 0, 1290); fade.addColorStop(0, 'rgba(10,19,34,0)'); fade.addColorStop(1, 'rgba(10,19,34,1)');
    g.fillStyle = fade; g.fillRect(0, 860, 1080, 432);
    g.fillStyle = '#0a1322'; g.fillRect(0, 1290, 1080, 630);
    // 细边框
    g.strokeStyle = 'rgba(230,198,144,.45)'; g.lineWidth = 2; g.strokeRect(44, 44, 992, 1832);
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillStyle = 'rgba(240,222,190,.9)'; g.font = `30px ${SERIF}`;
    g.fillText('如 果 那 天 ， 我 选 择 了 另 一 条 路', 540, 128);
    g.fillStyle = '#e6c690'; g.font = '26px Georgia, serif';
    g.fillText(STORY.routes[r].en.split('').join(String.fromCharCode(8202)), 540, 1400);
    g.fillStyle = '#fbf1df'; g.font = `500 120px ${SERIF}`;
    spaced(g, E.title, 540, 1548, 40);
    g.fillStyle = 'rgba(230,198,144,.85)'; g.font = '26px Georgia, serif';
    g.fillText(E.en, 540, 1606);
    g.fillStyle = '#f1d3a0'; g.font = `40px ${SERIF}`;
    g.fillText(E.sub, 540, 1690);
    g.fillStyle = 'rgba(230,226,217,.88)'; g.font = `32px ${SERIF}`;
    E.poster.forEach((l, i) => g.fillText(l, 540, 1764 + i * 50));
    return c;
  }
  function spaced(g, text, cx, y, sp) {
    const chars = text.split(''); const ws = chars.map(ch => g.measureText(ch).width);
    const total = ws.reduce((a, b) => a + b, 0) + sp * (chars.length - 1);
    let x = cx - total / 2; g.textAlign = 'left';
    chars.forEach((ch, i) => { g.fillText(ch, x, y); x += ws[i] + sp; });
    g.textAlign = 'center';
  }

  async function open(r) {
    route = r;
    const m = $('#posterModal'), im = $('#posterImg');
    im.removeAttribute('src');
    m.classList.add('open');
    try {
      const c = await draw(r);
      c.toBlob(b => {
        if (!b) { im.src = c.toDataURL('image/png'); return; }
        if (url) URL.revokeObjectURL(url);
        url = URL.createObjectURL(b); im.src = url;
      }, 'image/png');
    } catch (e) { ENGINE.toast('海报生成失败，请换用较新的浏览器再试'); close(); }
  }
  function close() { $('#posterModal').classList.remove('open'); }
  $('#closePoster').onclick = close;
  $('#posterModal').addEventListener('click', e => { if (e.target.id === 'posterModal') close(); });
  $('#savePoster').onclick = () => {
    const src = $('#posterImg').getAttribute('src'); if (!src) return;
    const a = document.createElement('a'); a.href = src; a.download = `我的平行人生-${STORY.endings[route].title}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    ENGINE.toast('已开始下载；若没有反应，请长按图片保存');
  };
  window.POSTER = { open, close, draw };
})();

</script>
<script>
/* =========================================================
   engine.js — 状态机、镜头、文案、互动系统、存档
   依赖：STORY(story.js) SCENES(scenes-*.js) AUDIO(audio.js) POSTER(poster.js)
   ========================================================= */
(function () {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const app = $('#app'), stage = $('#stage'), cap = $('#cap'), hits = $('#hits');
  const capLines = $('.cap-lines', cap), capMeta = $('.cap-meta', cap), capHint = $('.cap-hint', cap);
  const btnNext = $('#next'), btnSkip = $('#skipAct'), choiceBox = $('.cap-choices', cap);
  const KEY = 'parallel-life-v4';

  const S = { screen: 'title', route: null, actIdx: 0, beatIdx: 0, root: null, token: 0, busy: false, done: { home: false, far: false }, pending: null, track: 0 };
  window.__H5 = S; // 测试钩子

  /* ---------- 存档 ---------- */
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ route: S.route, actIdx: S.actIdx, done: S.done, screen: S.screen })); } catch (e) {} }
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }

  /* ---------- 基础 UI ---------- */
  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
  function clearHits() { cancelAnimationFrame(S.track); hits.innerHTML = ''; hits.className = ''; }
  function setCap(mode) { cap.className = 'cap ' + (mode || ''); }

  function showLines(lines, meta) {
    capLines.innerHTML = '';
    capMeta.textContent = meta || '';
    (lines || []).forEach((t, i) => {
      const p = document.createElement('p');
      p.textContent = t;
      if (/^“/.test(t)) p.className = 'quote';
      p.style.animationDelay = (0.15 + i * 0.55) + 's';
      capLines.appendChild(p);
    });
    capLines.scrollTop = 0;
  }
  function revealAllLines() { capLines.querySelectorAll('p').forEach(p => { p.style.animationDelay = '0s'; p.classList.add('shown'); }); }

  /* ---------- 镜头 ---------- */
  function setCam(cam, t) {
    if (!S.root || !cam) return;
    const c = $('.cam', S.root);
    const [fx, fy, s] = cam;
    c.style.transitionDuration = (t == null ? 2.2 : t) + 's';
    // 限制平移范围，镜头永远不会移出画面边缘
    const lim = Math.max(0, (s - 1) * 50), cl = v => Math.max(-lim, Math.min(lim, v));
    c.style.transform = `translate(${cl(-(fx - 50) * s).toFixed(2)}%, ${cl(-(fy - 50) * s).toFixed(2)}%) scale(${s})`;
  }
  function flag(name, on) {
    if (!S.root) return;
    S.root.classList.toggle('f-' + name, on);
    const sc = SCENES[S.root.dataset.scene];
    if (sc && sc.flag) sc.flag(S.root, name, on);
  }
  function shot(name) {
    if (!S.root || !name) return;
    S.root.querySelectorAll('.shot').forEach(el => el.classList.toggle('on', el.dataset.shot === name));
    S.root.dataset.shot = name;
  }

  /* ---------- 场景装载 ---------- */
  function mountScene(name, init) {
    const sc = SCENES[name];
    const built = sc.build(init || []);
    const root = document.createElement('div');
    root.className = 'act';
    root.dataset.scene = name;
    root.innerHTML = `<div class="cam">${built.cam}</div><div class="fp">${built.fp || ''}</div><div class="paper"></div><div class="vig"></div>`;
    const old = stage.querySelector('.act');
    if (old) { old.classList.add('leaving'); const sco = SCENES[old.dataset.scene]; if (sco && sco.leave) sco.leave(old); setTimeout(() => old.remove(), 900); }
    stage.appendChild(root);
    S.root = root;
    (init || []).forEach(f => flag(f, true));
    const first = root.querySelector('.shot');
    if (first) shot(first.dataset.shot);
    setCam([50, 50, 1], 0);
    if (sc.enter) sc.enter(root);
    return root;
  }

  /* ---------- 标题卡（幕间） ---------- */
  function titleCard(no, title, route, cb) {
    const tc = $('#chapter');
    tc.innerHTML = `<div class="tc-route">${route}</div><div class="tc-no">${no}</div><div class="tc-title">${title}</div><div class="tc-tap">轻触继续</div>`;
    tc.classList.add('on');
    let done = false;
    const close = () => { if (done) return; done = true; tc.classList.remove('on'); tc.removeEventListener('click', close); setTimeout(cb, 300); };
    tc.addEventListener('click', close);
    setTimeout(close, 2600);
  }

  /* ---------- 剧情推进 ---------- */
  function currentBeats() {
    if (S.screen === 'prologue') return STORY.prologue.beats;
    return STORY.routes[S.route].acts[S.actIdx].beats;
  }
  function startPrologue(atRoad) {
    S.screen = 'prologue'; S.route = null; S.actIdx = 0;
    AUDIO.theme('night');
    $('#progress').classList.remove('on');
    mountScene('prologue');
    runBeat(atRoad ? STORY.prologue.beats.length - 1 : 0);
  }
  function startRoute(route, actIdx) {
    S.screen = 'act'; S.route = route; S.actIdx = actIdx || 0;
    startAct();
  }
  function startAct() {
    const R = STORY.routes[S.route], A = R.acts[S.actIdx];
    AUDIO.theme(S.route);
    save();
    updateProgress();
    clearHits(); setCap('hidden');
    mountScene(A.scene, A.init);
    titleCard(A.no, A.title, R.name, () => runBeat(0));
  }
  function updateProgress() {
    const p = $('#progress');
    if (!S.route) { p.classList.remove('on'); return; }
    const n = STORY.routes[S.route].acts.length;
    p.innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i < S.actIdx ? 'done' : i === S.actIdx ? 'cur' : ''}"></i>`).join('');
    p.classList.add('on');
  }

  function runBeat(i) {
    const beats = currentBeats();
    S.beatIdx = i;
    const b = beats[i];
    const tok = ++S.token;
    clearHits();
    if (b.shot) shot(b.shot);
    (b.rm || []).forEach(f => flag(f, false));
    (b.add || []).forEach(f => flag(f, true));
    if (b.cam) setCam(b.cam, b.camT);
    if (b.sfx) AUDIO.sfx(b.sfx);
    const meta = S.screen === 'act' ? (() => { const A = STORY.routes[S.route].acts[S.actIdx]; return `${A.no} · ${A.title}`; })() : '';
    showLines(b.lines || [], meta);
    choiceBox.innerHTML = '';
    btnSkip.hidden = true;
    const isLast = i === beats.length - 1;
    if (b.act) {
      setCap((b.lines && b.lines.length ? '' : 'slim') + ' pending');
      capHint.textContent = b.act.hint || '';
      btnNext.hidden = true;
      setupAct(b.act, tok);
    } else {
      setCap((b.letter ? 'bare' : (b.lines && b.lines.length ? '' : 'slim')) + ' tapnext');
      capHint.textContent = '';
      btnNext.hidden = false;
      btnNext.textContent = isLast ? (S.screen === 'act' ? (S.actIdx === STORY.routes[S.route].acts.length - 1 ? '走向结局 →' : '下一幕 →') : '继续 →') : '继续';
      btnNext.onclick = () => {
        if (S.token !== tok) return;
        const unread = [...capLines.querySelectorAll('p')].some(p => getComputedStyle(p).opacity < 0.95);
        if (unread) { revealAllLines(); return; }
        AUDIO.sfx('tap');
        advance();
      };
    }
  }

  function advance() {
    const beats = currentBeats();
    if (S.beatIdx < beats.length - 1) return runBeat(S.beatIdx + 1);
    if (S.screen === 'act') {
      const R = STORY.routes[S.route];
      if (S.actIdx < R.acts.length - 1) { S.actIdx++; startAct(); }
      else showEnding(S.route);
    }
  }

  function completeAct(a, tok, extra) {
    if (S.token !== tok) return;
    S.token++;
    const t2 = S.token;
    clearHits();
    capHint.textContent = '';
    btnSkip.hidden = true;
    (a.rm || []).forEach(f => flag(f, false));
    (a.add || []).forEach(f => flag(f, true));
    if (a.cam) setCam(a.cam, a.camT);
    if (a.sfx) AUDIO.sfx(a.sfx);
    if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
    if (a.type === 'choice') return extra && extra();
    setTimeout(() => { if (S.token === t2) advance(); }, a.wait || 900);
  }

  /* ---------- 互动 ---------- */
  function target(name) { return S.root && S.root.querySelector(`[data-hit="${name}"]`); }
  function track(el, btn, minW, minH) {
    const loop = () => {
      if (!el.isConnected || !btn.isConnected) return;
      const r = el.getBoundingClientRect(), a = app.getBoundingClientRect();
      const w = Math.max(minW || 70, Math.min(r.width, 240)), h = Math.max(minH || 70, Math.min(r.height, 240));
      btn.style.left = (r.left - a.left + r.width / 2 - w / 2) + 'px';
      btn.style.top = (r.top - a.top + r.height / 2 - h / 2) + 'px';
      btn.style.width = w + 'px'; btn.style.height = h + 'px';
      S.track = requestAnimationFrame(loop);
    };
    loop();
  }
  function armSkip(a, tok) {
    setTimeout(() => {
      if (S.token !== tok) return;
      btnSkip.hidden = false;
      btnSkip.onclick = () => completeAct(a, tok);
    }, a.type === 'choice' ? 1e9 : 7000);
  }

  function setupAct(a, tok) {
    armSkip(a, tok);
    if (a.type === 'tap' || a.type === 'hold') {
      const el = target(a.hit);
      if (!el) { console.warn('missing hit', a.hit); completeAct(a, tok); return; }
      const btn = document.createElement('button');
      btn.className = 'hit ' + a.type;
      btn.setAttribute('aria-label', a.hint);
      btn.innerHTML = a.type === 'hold'
        ? '<span class="ring"></span><svg class="prog" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26"/></svg><span class="hold-tip">长按</span>'
        : '<span class="ring"></span>';
      hits.appendChild(btn);
      track(el, btn);
      if (a.type === 'tap') btn.addEventListener('click', () => { btn.classList.add('hit-done'); completeAct(a, tok); });
      else holdLogic(btn, () => completeAct(a, tok));
    } else if (a.type === 'swipe') {
      const zone = document.createElement('div');
      zone.className = 'swipe-zone dir-' + a.dir;
      zone.innerHTML = `<div class="swipe-guide"><span>${a.dir === 'left' ? '←' : a.dir === 'up' ? '↑' : '→'}</span></div>`;
      hits.appendChild(zone);
      let sx = null, sy = null;
      zone.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; zone.setPointerCapture(e.pointerId); });
      zone.addEventListener('pointermove', e => {
        if (sx == null) return;
        const dx = e.clientX - sx;
        if (S.root) S.root.style.setProperty('--drag', Math.max(-1, Math.min(0, dx / 140)).toFixed(3));
      });
      const end = e => {
        if (sx == null) return;
        const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
        const ok = a.dir === 'left' ? dx < -45 : a.dir === 'right' ? dx > 45 : dy < -45;
        if (S.root) S.root.style.removeProperty('--drag');
        if (ok) completeAct(a, tok);
      };
      zone.addEventListener('pointerup', end);
      zone.addEventListener('pointercancel', () => { sx = null; if (S.root) S.root.style.removeProperty('--drag'); });
    } else if (a.type === 'drag') {
      dragLogic(a, tok);
    } else if (a.type === 'pan') {
      panLogic(a, tok);
    } else if (a.type === 'choice') {
      setCap('pick');
      choiceBox.innerHTML = a.options.map(o => `<button class="choice" data-id="${o.id}"><b>${o.label}</b><small>${o.sub}</small></button>`).join('');
      choiceBox.querySelectorAll('.choice').forEach(btn => btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        AUDIO.sfx('choose');
        S.root.classList.add('pick-' + id);
        setCam(id === 'home' ? [36, 44, 1.5] : [64, 44, 1.5], 1.6);
        completeAct(a, tok, () => setTimeout(() => startRoute(id, 0), 1300));
      }));
    }
  }

  function holdLogic(btn, done) {
    let start = 0, raf = 0, ok = false;
    const circ = 2 * Math.PI * 26, c = btn.querySelector('.prog circle');
    c.style.strokeDasharray = circ; c.style.strokeDashoffset = circ;
    const step = () => {
      const p = Math.min(1, (performance.now() - start) / 1000);
      c.style.strokeDashoffset = circ * (1 - p);
      if (S.root) S.root.style.setProperty('--hold', p.toFixed(3));
      if (p >= 1) { ok = true; btn.classList.add('hit-done'); done(); return; }
      raf = requestAnimationFrame(step);
    };
    const down = e => { if (ok) return; e.preventDefault(); start = performance.now(); try { btn.setPointerCapture(e.pointerId); } catch (_) {} AUDIO.sfx('hum'); step(); };
    const up = () => { if (ok) return; cancelAnimationFrame(raf); c.style.strokeDashoffset = circ; if (S.root) S.root.style.setProperty('--hold', 0); };
    btn.addEventListener('pointerdown', down);
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => btn.addEventListener(t, up));
    btn.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { start = performance.now(); step(); } });
    btn.addEventListener('keyup', up);
    btn.addEventListener('contextmenu', e => e.preventDefault());
  }

  function dragLogic(a, tok) {
    const el = target(a.hit), drop = target(a.drop);
    if (!el || !drop) { completeAct(a, tok); return; }
    const svg = el.ownerSVGElement;
    const handle = document.createElement('div');
    handle.className = 'hit drag';
    handle.innerHTML = '<span class="ring"></span><span class="drag-arrow"></span>';
    hits.appendChild(handle);
    const dz = document.createElement('div');
    dz.className = 'drop-zone';
    hits.appendChild(dz);
    const posDz = () => { const r = drop.getBoundingClientRect(), ap = app.getBoundingClientRect(); Object.assign(dz.style, { left: r.left - ap.left + 'px', top: r.top - ap.top + 'px', width: r.width + 'px', height: r.height + 'px' }); };
    posDz();
    track(el, handle, 90, 90);
    let start = null, base = { x: 0, y: 0 };
    const toSvg = (cx, cy) => { const p = svg.createSVGPoint(); p.x = cx; p.y = cy; return p.matrixTransform(svg.getScreenCTM().inverse()); };
    handle.addEventListener('pointerdown', e => { start = toSvg(e.clientX, e.clientY); handle.setPointerCapture(e.pointerId); el.style.transition = 'none'; handle.classList.add('grab'); AUDIO.sfx('roll'); });
    handle.addEventListener('pointermove', e => {
      if (!start) return;
      const p = toSvg(e.clientX, e.clientY);
      base = { x: p.x - start.x, y: p.y - start.y };
      el.style.transform = `translate(${base.x}px, ${base.y}px)`;
      posDz();
    });
    const end = e => {
      if (!start) return;
      start = null; handle.classList.remove('grab');
      const r = drop.getBoundingClientRect(), er = el.getBoundingClientRect();
      const cx = er.left + er.width / 2, cy = er.top + er.height / 2;
      const inside = cx > r.left - 30 && cx < r.right + 30 && cy > r.top - 40 && cy < r.bottom + 40;
      el.style.transition = 'transform .6s cubic-bezier(.2,.8,.2,1)';
      if (inside) {
        el.style.transform = '';
        completeAct(a, tok);
      } else {
        el.style.transform = 'translate(0px,0px)';
        toast('再往房间里拖一点');
      }
    };
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  }

  function panLogic(a, tok) {
    let idx = 0;
    const n = a.stops;
    const wrap = document.createElement('div');
    wrap.className = 'pan-ui';
    wrap.innerHTML = `<button class="pan-btn prev" aria-label="向左看">‹</button><div class="pan-dots">${Array.from({ length: n }, (_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div><button class="pan-btn next" aria-label="向右看">›</button>`;
    const zone = document.createElement('div');
    zone.className = 'swipe-zone pan';
    hits.appendChild(zone); hits.appendChild(wrap);
    const go = d => {
      idx = Math.max(0, Math.min(n - 1, idx + d));
      S.root.style.setProperty('--pan', idx);
      flag('pan' + idx, true);
      AUDIO.sfx('step');
      wrap.querySelectorAll('.pan-dots i').forEach((el, i) => el.classList.toggle('on', i === idx));
      if (idx === n - 1) setTimeout(() => completeAct(a, tok), 900);
    };
    wrap.querySelector('.prev').onclick = () => go(-1);
    wrap.querySelector('.next').onclick = () => go(1);
    let sx = null;
    zone.addEventListener('pointerdown', e => { sx = e.clientX; zone.setPointerCapture(e.pointerId); });
    zone.addEventListener('pointerup', e => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (dx < -40) go(1); else if (dx > 40) go(-1); });
    zone.addEventListener('wheel', e => { if (Math.abs(e.deltaX) + Math.abs(e.deltaY) > 30) go(e.deltaY > 0 || e.deltaX > 0 ? 1 : -1); }, { passive: true });
  }

  /* ---------- 结局 / 终章 ---------- */
  function showEnding(route) {
    S.screen = 'ending'; S.done[route] = true; save();
    clearHits(); setCap('hidden');
    $('#progress').classList.remove('on');
    const E = STORY.endings[route];
    AUDIO.theme('end');
    const root = mountScene(E.scene);
    root.classList.add('ending');
    const panel = document.createElement('div');
    panel.className = 'end-panel';
    panel.innerHTML = `<div class="end-scroll"><div class="end-tag">${STORY.routes[route].en} · 结局</div><h2 class="end-title">${E.title}</h2><div class="end-en">${E.en}</div><p class="end-sub">${E.sub}</p><div class="end-poem">${E.lines.map(l => l ? `<p>${l}</p>` : '<p class="gap"></p>').join('')}</div></div>
      <div class="end-actions"><button class="primary" id="mkPoster">生成我的结局海报</button><button class="secondary" id="toFinale">进入终章 →</button></div>`;
    root.appendChild(panel);
    setTimeout(() => panel.classList.add('on'), 400);
    $('#mkPoster').onclick = () => POSTER.open(route);
    $('#toFinale').onclick = () => { AUDIO.sfx('tap'); showFinale(); };
    AUDIO.sfx('ending');
  }

  function showFinale() {
    S.screen = 'finale'; save();
    clearHits();
    const root = mountScene('finale');
    root.classList.add('finale');
    const L = STORY.finale.lines;
    let i = 0;
    const tok = ++S.token;
    const box = document.createElement('div');
    box.className = 'finale-lines';
    root.appendChild(box);
    setCap('slim finale-cap');
    capLines.innerHTML = ''; capMeta.textContent = '终章'; capHint.textContent = ''; choiceBox.innerHTML = ''; btnSkip.hidden = true;
    const step = () => {
      if (S.token !== tok) return;
      if (i < L.length) {
        const p = document.createElement('p');
        p.textContent = '“' + L[i] + '”';
        if (i === L.length - 1) p.className = 'last';
        box.appendChild(p);
        box.querySelectorAll('p').forEach((el, k) => el.classList.toggle('old', k < box.children.length - 2 && i < L.length - 1));
        if (i === L.length - 1) { box.classList.add('end'); root.classList.add('f-dawn'); }
        i++;
        btnNext.hidden = false;
        btnNext.textContent = i === L.length ? '完' : '继续';
      } else {
        btnNext.hidden = true;
        const other = S.route === 'home' ? 'far' : 'home';
        const otherName = STORY.routes[other].name;
        choiceBox.innerHTML = `<button class="choice" id="fPoster"><b>再看我的海报</b><small>${STORY.endings[S.route].title}</small></button><button class="choice" id="fOther"><b>体验另一条人生</b><small>${otherName}</small></button><button class="choice wide" id="fRestart"><b>从头开始</b><small>回到那封信</small></button>`;
        setCap('pick finale-cap');
        $('#fPoster').onclick = () => POSTER.open(S.route);
        $('#fOther').onclick = () => { AUDIO.sfx('choose'); startRoute(other, 0); };
        $('#fRestart').onclick = () => restart();
      }
    };
    btnNext.onclick = () => { AUDIO.sfx('tap'); step(); };
    setTimeout(step, 900);
  }

  /* ---------- 开始 / 菜单 ---------- */
  function restart() { S.token++; clearHits(); closeMenu(); showTitle(); }
  function showTitle() {
    S.screen = 'title'; S.route = null;
    AUDIO.theme('night');
    $('#progress').classList.remove('on');
    setCap('hidden');
    mountScene('title');
    const saved = load();
    if (saved) S.done = saved.done || S.done;
    const resume = $('#resume');
    if (saved && saved.route && saved.screen === 'act') {
      const A = STORY.routes[saved.route].acts[saved.actIdx];
      resume.hidden = false;
      resume.innerHTML = `继续上次 · ${STORY.routes[saved.route].name} ${A.no}`;
      resume.onclick = () => begin(() => startRoute(saved.route, saved.actIdx));
    } else resume.hidden = true;
    $('#titleUi').classList.add('on');
  }
  function begin(fn) {
    AUDIO.unlock();
    $('#titleUi').classList.remove('on');
    setTimeout(fn, 500);
  }
  function openMenu() { $('#menu').classList.add('on'); }
  function closeMenu() { $('#menu').classList.remove('on'); }

  $('#start').onclick = () => begin(() => startPrologue(false));
  $('#menuBtn').onclick = openMenu;
  $('#menuClose').onclick = closeMenu;
  $('#menu').addEventListener('click', e => { if (e.target.id === 'menu') closeMenu(); });
  $('#mRoad').onclick = () => { closeMenu(); $('#titleUi').classList.remove('on'); AUDIO.unlock(); startPrologue(true); };
  $('#mRestart').onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} restart(); };
  $('#mHome').onclick = () => { closeMenu(); $('#titleUi').classList.remove('on'); AUDIO.unlock(); startRoute('home', 0); };
  $('#mFar').onclick = () => { closeMenu(); $('#titleUi').classList.remove('on'); AUDIO.unlock(); startRoute('far', 0); };
  $('#sound').onclick = () => { const on = AUDIO.toggle(); $('#sound').classList.toggle('off', !on); $('#sound').setAttribute('aria-label', on ? '关闭声音' : '开启声音'); toast(on ? '声音已开启' : '已静音'); };
  /* 轻触画面任意位置继续：只在当前这一拍没有待完成的互动时生效 */
  let lastTap = 0;
  app.addEventListener('click', e => {
    if (btnNext.hidden || S.screen === 'title' || S.screen === 'ending') return;
    if (e.target.closest('button, a, .topbar, .menu, .poster-modal, .chapter.on, .title-ui, .end-panel, #hits > *')) return;
    if ($('#chapter').classList.contains('on') || $('#menu').classList.contains('on') || $('#posterModal').classList.contains('open')) return;
    const now = Date.now(); if (now - lastTap < 380) return; lastTap = now;
    btnNext.click();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeMenu(); POSTER.close(); }
    if ((e.key === 'ArrowRight' || e.key === 'Enter') && !btnNext.hidden && document.activeElement === document.body) btnNext.click();
  });

  window.ENGINE = { startPrologue, startRoute, showEnding, showFinale, restart, toast, state: S, advance, flag, setCam };

  /* 加载：等待主角图片解码后进入标题页 */
  const img = new Image();
  const ready = () => { $('#loader').classList.add('done'); showTitle(); };
  img.onload = ready; img.onerror = ready;
  img.src = window.HEROINE_SRC;
  setTimeout(() => { if (!$('#loader').classList.contains('done')) ready(); }, 4000);
})();

</script>
</body>
</html>
